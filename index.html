<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Словарик для кисы · разбор английских слов</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<style>
  :root {
    --bg: #faf6f1;
    --card: #ffffff;
    --ink: #3d3630;
    --muted: #9a8f83;
    --accent: #c2704f;
    --accent-soft: #f3e2d9;
    --border: #eadfd4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 1.7em; font-weight: normal; letter-spacing: .02em; }
  header p { color: var(--muted); font-size: .95em; margin-top: 6px; font-style: italic; }

  .seg {
    display: flex; gap: 4px;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 4px;
    margin: 0 auto 16px;
    width: fit-content;
  }
  .seg button {
    background: transparent; color: var(--ink);
    padding: 8px 20px; border-radius: 9px;
  }
  .seg button.on { background: var(--accent); color: #fff; }

  form {
    display: flex; gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 2px 10px rgba(120, 90, 60, .06);
  }
  #chform { flex-direction: column; }
  textarea {
    border: none; outline: none; background: transparent;
    font: inherit; font-size: 1em; padding: 8px 10px; color: var(--ink);
    min-height: 180px; resize: vertical;
  }
  textarea::placeholder { color: var(--muted); }
  #chform button { align-self: flex-end; }
  .hint { color: var(--muted); font-size: .85em; padding: 0 10px 4px; font-style: italic; }
  .hidden { display: none !important; }
  input {
    flex: 1; border: none; outline: none; background: transparent;
    font: inherit; font-size: 1.1em; padding: 8px 10px; color: var(--ink);
  }
  input::placeholder { color: var(--muted); }
  button {
    border: none; border-radius: 10px;
    background: var(--accent); color: #fff;
    font: inherit; font-size: 1em;
    padding: 10px 22px; cursor: pointer;
    transition: opacity .15s;
  }
  button:disabled { opacity: .5; cursor: default; }

  .status { text-align: center; color: var(--muted); margin: 18px 0; min-height: 1.4em; font-style: italic; }
  .status.error { color: #b0503c; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    margin-top: 18px;
    box-shadow: 0 2px 10px rgba(120, 90, 60, .06);
    line-height: 1.65;
    font-size: 1.02em;
    animation: fadein .3s ease;
    overflow-wrap: break-word;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .card b { color: var(--accent); }
  .card .lvl { letter-spacing: .05em; }
  .card hr { border: none; border-top: 1px dashed var(--border); margin: 10px 0; }

  /* скрытый перевод: размытая «пилюля», открывается по тапу */
  .tr {
    display: inline-block;
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 0 8px;
    cursor: pointer;
    user-select: none;
    filter: blur(5px);
    transition: filter .2s;
  }
  .tr.open { filter: none; cursor: default; user-select: text; }

  /* словарь по главе */
  .stats { margin-bottom: 10px; }
  .srow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .srow .slvl { min-width: 54px; }
  .srow .balls { font-size: .8em; letter-spacing: 1px; }
  .srow .sn { color: var(--muted); white-space: nowrap; }
  .tlevel { margin-bottom: 14px; font-size: 1.05em; }
  .tlevel b { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: .92em;
    white-space: nowrap;
  }
  .chip b { color: var(--ink); }
  .chip .n { color: var(--accent); font-weight: bold; }
  .dict { width: 100%; border-collapse: collapse; }
  .dict td {
    padding: 9px 8px;
    border-top: 1px dashed var(--border);
    vertical-align: top;
  }
  .dict tr:first-child td { border-top: none; }
  .dict .w { font-weight: bold; color: var(--accent); }
  .dict .ipa { color: var(--muted); font-size: .88em; font-family: 'Segoe UI', Arial, sans-serif; }
  .dict .pos {
    display: inline-block;
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 0 7px;
    font-size: .78em;
    font-style: italic;
    color: var(--ink);
    white-space: nowrap;
  }
  .dict .ru { }
  .dict .lv { white-space: nowrap; font-size: .9em; }
  .dcount { color: var(--muted); font-style: italic; margin-bottom: 10px; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--accent-soft); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align: center; color: var(--muted); font-size: .85em; margin-top: 42px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📖 Словарик для кисы</h1>
    <p id="subtitle">введи английское слово или выражение — получишь полный разбор</p>
  </header>

  <div class="seg">
    <button type="button" id="modeWord" class="on">Слово</button>
    <button type="button" id="modeChapter">Глава</button>
  </div>

  <form id="form">
    <input id="q" type="text" placeholder="например: handle, get along with…"
           autocomplete="off" autofocus maxlength="80">
    <button id="go" type="submit">Разобрать</button>
  </form>

  <form id="chform" class="hidden">
    <textarea id="chq" maxlength="20000"
      placeholder="вставь сюда текст главы на английском…"></textarea>
    <div class="hint">до 20 000 символов; знакомые слова появятся сразу, новые — по мере перевода (словарик копится от главы к главе)</div>
    <button id="chgo" type="submit">Составить словарь</button>
  </form>

  <div class="status" id="status"></div>
  <div id="results"></div>

  <footer>сделано с любовью ♥</footer>
</div>

<script>
const API_BASE = 'https://198-46-253-50.sslip.io';
const API = API_BASE + '/word';
const API_CHAPTER = API_BASE + '/chapter2';
const TOKEN = '162ffe8e282a1dfb7c2963fcaae68f9e';

const form = document.getElementById('form');
const q = document.getElementById('q');
const go = document.getElementById('go');
const chform = document.getElementById('chform');
const chq = document.getElementById('chq');
const chgo = document.getElementById('chgo');
const modeWord = document.getElementById('modeWord');
const modeChapter = document.getElementById('modeChapter');
const subtitle = document.getElementById('subtitle');
const statusEl = document.getElementById('status');
const results = document.getElementById('results');

const LVL = { A1: '🟢', A2: '🟡', B1: '🔵', B2: '🟣', C1: '🟠', C2: '🔴' };
const LVL_ORDER = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];

function setMode(chapterMode) {
  modeWord.classList.toggle('on', !chapterMode);
  modeChapter.classList.toggle('on', chapterMode);
  form.classList.toggle('hidden', chapterMode);
  chform.classList.toggle('hidden', !chapterMode);
  subtitle.textContent = chapterMode
    ? 'вставь главу книги — получишь словарь всех слов с уровнями'
    : 'введи английское слово или выражение — получишь полный разбор';
  setStatus('');
  (chapterMode ? chq : q).focus();
}
modeWord.addEventListener('click', () => setMode(false));
modeChapter.addEventListener('click', () => setMode(true));

// мини-рендер markdown: экранируем HTML, потом **жирный**, *курсив*,
// {{перевод}} -> скрытая пилюля, переносы
function mdToHtml(md) {
  let h = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^#+\s*(.+)$/gm, '**$1**')
    .replace(/\{\{([^{}]+)\}\}/g, '<span class="tr" title="показать перевод">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*\n]+)\*/g, '<i>$1</i>')
    .replace(/^---+$/gm, '<hr>');
  return h.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}

// открытие переводов по тапу
document.addEventListener('click', ev => {
  const t = ev.target.closest('.tr');
  if (t) t.classList.add('open');
});

function setStatus(text, isError, spin) {
  statusEl.className = 'status' + (isError ? ' error' : '');
  statusEl.innerHTML = (spin ? '<span class="spinner"></span>' : '') + text;
}

async function lookup(text) {
  go.disabled = true; q.disabled = true;
  setStatus('думаю над словом…', false, true);
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Token': TOKEN },
      body: JSON.stringify({ text })
    });
    if (r.status === 429) { setStatus('сервер занят — подожди пару секунд и попробуй ещё раз', true); return; }
    if (!r.ok) { setStatus('ошибка сервера (' + r.status + ') — попробуй позже', true); return; }
    const data = await r.json();
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = mdToHtml(data.text);
    results.prepend(card);
    setStatus('');
    q.value = '';
  } catch (e) {
    setStatus('нет связи с сервером — проверь интернет', true);
  } finally {
    go.disabled = false; q.disabled = false; q.focus();
  }
}

form.addEventListener('submit', ev => {
  ev.preventDefault();
  const text = q.value.trim();
  if (text) lookup(text);
});

// ---- режим «Глава»: словарь всех слов главы ----

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// парсим строки "слово | ipa | часть речи | перевод | уровень"
function renderDict(raw) {
  const words = [];
  for (const line of raw.split('\n')) {
    const parts = line.split('|').map(s => s.trim());
    if (parts.length < 4 || !parts[0]) continue;
    const lvl = (parts[4] || '').toUpperCase().match(/[ABC][12]/);
    words.push({
      w: parts[0], ipa: parts[1] || '', pos: parts[2] || '',
      ru: parts[3] || '', lvl: lvl ? lvl[0] : ''
    });
  }
  if (!words.length) return null;
  words.sort((a, b) => a.w.toLowerCase().localeCompare(b.w.toLowerCase()));

  const counts = {};
  for (const w of words) if (w.lvl) counts[w.lvl] = (counts[w.lvl] || 0) + 1;

  const total = words.length;
  let html = '<div class="stats">';
  for (const l of LVL_ORDER) {
    if (!counts[l]) continue;
    const pct = counts[l] / total * 100;
    const filled = Math.min(10, Math.max(1, Math.round(pct / 10)));  // 1 шарик = 10%
    html += '<div class="srow"><span class="slvl">' + LVL[l] + ' <b>' + l + '</b></span>'
          + '<span class="balls">' + LVL[l].repeat(filled) + '⚪'.repeat(10 - filled) + '</span>'
          + '<span class="sn">' + Math.round(pct) + '% — ' + counts[l] + ' шт</span></div>';
  }
  html += '</div>';
  html += '<div class="dcount">Всего слов: ' + total + '</div>';
  // уровень текста = уровень, ниже которого лежит ~80% слов (медиана всегда
  // проседает к A2 из-за служебной базовой лексики любого текста)
  const idxs = words.map(w => LVL_ORDER.indexOf(w.lvl)).filter(i => i >= 0).sort((a, b) => a - b);
  if (idxs.length) {
    const tl = LVL_ORDER[idxs[Math.min(idxs.length - 1, Math.floor(idxs.length * 0.8))]];
    html += '<div class="tlevel">Уровень текста: <b>' + tl + '</b> ' + LVL[tl] + '</div>';
  }
  html += '<table class="dict">';
  for (const w of words) {
    const ipa = w.ipa ? '<br><span class="ipa">/' + esc(w.ipa.replace(/^\/|\/$/g, '')) + '/</span>' : '';
    html += '<tr>'
      + '<td><span class="lv">' + (LVL[w.lvl] || '⚪') + '</span> '
      + '<span class="w">' + esc(w.w) + '</span>' + ipa + '</td>'
      + '<td><span class="pos">' + esc(w.pos) + '</span></td>'
      + '<td class="ru">' + esc(w.ru) + '</td>'
      + '</tr>';
  }
  html += '</table>';
  return html;
}

function postChapter(text) {
  return fetch(API_CHAPTER, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Auth-Token': TOKEN },
    body: JSON.stringify({ text })
  });
}

// связь оборвалась или сервер занят — он всё равно досчитывает и кладёт ответ
// в кэш; повторяем тот же запрос раз в 20с, пока не придёт кэш-хит
async function pollChapter(text, msg) {
  setStatus(msg, false, true);
  const deadline = Date.now() + 8 * 60 * 1000;
  while (Date.now() < deadline) {
    try {
      const r = await postChapter(text);
      if (r.status !== 429) return r;
    } catch (e) {}
    await new Promise(res => setTimeout(res, 20000));
  }
  throw new Error('poll timeout');
}

// читаем поток NDJSON-событий сервера, дёргая onEvent для каждого объекта
async function readNdjson(r, onEvent) {
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (line) onEvent(JSON.parse(line));
    }
  }
  if (buf.trim()) onEvent(JSON.parse(buf.trim()));
}

async function lookupChapter(text) {
  chgo.disabled = true; chq.disabled = true;
  setStatus('изучаю главу…', false, true);
  let card = null, dictLines = [], meta = null, errMsg = null;
  const render = () => {
    const html = renderDict(dictLines.join('\n'));
    if (!html) return;
    if (!card) {
      card = document.createElement('div');
      card.className = 'card';
      results.prepend(card);
    }
    card.innerHTML = html;
  };
  const onEvent = ev => {
    if (ev.type === 'meta') {
      meta = ev;
      setStatus('нашла ' + ev.total + ' слов, ' + ev.cached +
        ' уже в словарике — перевожу остальные…', false, true);
    } else if (ev.type === 'lines') {
      dictLines.push(...ev.text.split('\n'));
      render();
      if (meta) setStatus('готово ' + Math.min(dictLines.length, meta.total) +
        ' из ' + meta.total + ' слов…', false, true);
    } else if (ev.type === 'status') {
      setStatus(ev.text, false, true);
    } else if (ev.type === 'done') {
      render();
    } else if (ev.type === 'error') {
      errMsg = ev.detail || 'ошибка сервера';
    }
  };
  try {
    let r;
    try {
      r = await postChapter(text);
    } catch (e) {
      r = await pollChapter(text, 'связь прервалась, но сервер досчитывает — жду результат…');
    }
    if (r.status === 429) {
      r = await pollChapter(text, 'сервер занят — жду очередь, не закрывай страницу…');
    }
    if (r.status === 400) {
      let msg = 'слишком длинный текст — разбей главу на части';
      try { msg = (await r.json()).detail || msg; } catch (e) {}
      setStatus(msg, true); return;
    }
    if (!r.ok) { setStatus('ошибка сервера (' + r.status + ') — попробуй позже', true); return; }
    try {
      await readNdjson(r, onEvent);
    } catch (e) {
      // поток оборвался — сервер досчитывает в кэш, дождёмся и перечитаем
      r = await pollChapter(text, 'связь прервалась, но сервер досчитывает — жду результат…');
      dictLines = []; meta = null; errMsg = null;
      await readNdjson(r, onEvent);
    }
    if (errMsg) { setStatus(errMsg, true); return; }
    if (!dictLines.length) { setStatus('не получилось разобрать ответ — попробуй ещё раз', true); return; }
    setStatus('');
  } catch (e) {
    setStatus('нет связи с сервером — проверь интернет', true);
  } finally {
    chgo.disabled = false; chq.disabled = false;
  }
}

chform.addEventListener('submit', ev => {
  ev.preventDefault();
  const text = chq.value.trim();
  if (text) lookupChapter(text);
});
</script>
</body>
</html>
